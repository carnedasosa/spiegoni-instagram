name: DM alle keyword

# Al posto di ManyChat: chi commenta la keyword sotto un reel riceve il regalo in DM (dm_keyword.py).
# Funziona solo per le keyword con "attivo": true in pubblicazione/keyword.json.
#
# Il cron di GitHub non è affidabile: il 15/11/2026 "ogni 5 minuti" è partito 3 volte in 19 ore.
# Quindi ogni giro resta acceso per circa 5 ore e mezza e controlla i commenti ogni 2 minuti; il cron
# serve solo a far ripartire il giro successivo (concurrency: un giro alla volta, il prossimo aspetta).
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      prova:
        description: "prova: conta cosa farebbe su tutte le keyword, senza mandare niente (un solo controllo)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dm
  cancel-in-progress: false

jobs:
  dm:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    defaults:
      run:
        working-directory: pubblicazione
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DM ai commenti con la keyword
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PROVA: ${{ inputs.prova }}
        run: |
          if [ "$PROVA" = "true" ]; then python3 dm_keyword.py --prova --tutte; exit $?; fi
          git config user.name "spiegoni-bot"
          git config user.email "actions@github.com"
          fine=$((SECONDS + 330*60))
          falliti=0
          while [ $SECONDS -lt $fine ]; do
            # Ogni volta l'ultima versione: un reel appena uscito porta il suo media_id in pubblicati.json.
            git pull -q --rebase || echo "::warning::git pull non riuscito, uso la versione che ho"
            echo "--- $(date -u +%H:%M) UTC"
            if python3 dm_keyword.py; then
              falliti=0
            else
              falliti=$((falliti + 1))
              # Token scaduto o errori di fila: fermo il giro (diventa rosso e si vede).
              if [ $falliti -ge 3 ]; then echo "::error::3 controlli falliti di fila, mi fermo"; exit 1; fi
            fi
            git add dm_serviti.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -q -m "DM alle keyword"
              salvato=no
              for i in 1 2 3; do if git pull -q --rebase && git push -q; then salvato=si; break; fi; sleep 5; done
              [ $salvato = si ] || echo "::warning::Commenti serviti non salvati: riprovo al prossimo controllo"
            fi
            sleep 120
          done
